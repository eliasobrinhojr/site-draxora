# Revisão automática antes da publicação.
# Roda em todo push e pull request. Se falhar, o GitHub mostra um X vermelho no commit:
# NÃO publique (não junte na main) até corrigir.
name: Revisão antes da publicação
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  revisao:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: PHP sem erro de sintaxe
        run: for f in api/*.php painel/*.php; do php -l "$f"; done
      - name: JavaScript sem erro de sintaxe
        run: node --check assets/js/main.js && node --check painel/painel.js
      - name: Nenhuma senha ou chave no repositório
        run: |
          if git ls-files | grep -iE '(^|/)(draxora-config\.php|\.env|.*\.sql|.*\.pem|.*\.key)$'; then
            echo "::error::Arquivo de configuração/segredo no repositório"; exit 1; fi
          if git grep -nE "('db_pass'|'export_key'|'salt')\s*=>\s*'[^']{12,}'" -- . ':!api/config.exemplo.txt'; then
            echo "::error::Parece haver uma senha ou chave no código"; exit 1; fi
          if git grep -nE "(AKIA[0-9A-Z]{16}|xkeysib-[0-9a-f]{20,}|sk_live_[0-9a-zA-Z]{20,}|ghp_[0-9A-Za-z]{30,}|-----BEGIN [A-Z ]*PRIVATE KEY)"; then
            echo "::error::Token ou chave privada no código"; exit 1; fi
      - name: Mesma versão de CSS/JS (?v=) em todas as páginas
        run: |
          n=$(grep -rhoE '(v5\.css|main\.js)\?v=[0-9]+' --include=*.html . | sed 's/.*?v=//' | sort -u | wc -l)
          if [ "$n" -ne 1 ]; then grep -rnoE '(v5\.css|main\.js)\?v=[0-9]+' --include=*.html .; echo "::error::?v= diferente entre páginas"; exit 1; fi
      - name: Nada carregado por http:// inseguro
        run: |
          if grep -rnE '(src|href)="http://' --include=*.html .; then echo "::error::Recurso em http://"; exit 1; fi
      - name: Proteções do servidor continuam no .htaccess
        run: |
          for t in 'Options -Indexes' 'Strict-Transport-Security' 'X-Frame-Options' 'Content-Security-Policy' 'RedirectMatch 404'; do
            grep -q "$t" .htaccess || { echo "::error::Falta '$t' no .htaccess"; exit 1; }; done
          grep -q 'Require all denied' api/.htaccess || { echo "::error::api/.htaccess sem bloqueio"; exit 1; }
      # Desde 04/11: o site num navegador de verdade, com banco de teste (SQLite). Os formulários
      # enviam de verdade para o PHP local. Teria barrado o erro de 04/11 (cadastro travado das 12h58 às 22h04).
      - name: PHP 8.5 para o teste do fluxo
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, mbstring, curl
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Navegador para o teste (Playwright + Chromium)
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Fluxo completo (páginas, formulários, downloads, painel)
        env:
          DX_CHAVE_TESTE: chave-de-teste-ci-1234567890
        run: |
          printf "<?php return ['db_dsn' => 'sqlite:%s/ci.db', 'export_key' => '%s', 'salt' => 'ci'];\n" "$RUNNER_TEMP" "$DX_CHAVE_TESTE" > "$RUNNER_TEMP/config.php"
          DRAXORA_CONFIG="$RUNNER_TEMP/config.php" php -S 127.0.0.1:8080 -t . > "$RUNNER_TEMP/php.log" 2>&1 &
          sleep 1
          node .github/testes/fluxo.js http://127.0.0.1:8080 local || { echo "--- log do PHP"; cat "$RUNNER_TEMP/php.log"; exit 1; }
